name: SG Dettingen-Dingelsdorf Kalender aktualisieren

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Abhängigkeiten installieren
        run: python -m pip install beautifulsoup4

      - name: Kalender aktualisieren
        run: python update_calendar.py

      - name: Änderungen prüfen
        run: git status --short

      - name: Kalender speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kalender.ics
          git diff --cached --quiet || git commit -m "Kalender aktualisiert"
          git push
